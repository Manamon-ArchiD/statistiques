swagger: "2.0"
info:
  title: Match Statistics API
  description: |
    API pour récupérer des statistiques détaillées sur les matchs, les créatures utilisées, et les rapports quotidiens.
  version: 1.0.0

host: undefined
basePath: /stats
schemes:
  - https

paths:
  /stats/match/{DDMMYYYY}:
    get:
      summary: Récupérer les statistiques globales et détaillées sur les matchs de la date spécifiée.
      description: |
        Cet endpoint retourne des statistiques globales sur tous les matchs joués à la date spécifiée,
        ainsi que des données sur les joueurs et les heures les plus actives.
      parameters:
        - name: DDMMYYYY
          in: path
          required: true
          type: string
          description: Date au format jour-mois-année (exemple : 24012025).
      produces:
        - application/json
      responses:
        200:
          description: Statistiques globales des matchs récupérées avec succès.
          schema:
            type: object
            properties:
              numberOfMatches:
                type: integer
                example: 1500
              mostPlayedHours:
                type: array
                items:
                  type: object
                  properties:
                    datetime:
                      type: string
                      format: date-time
                      example: "2025-01-24T07:00:00Z"
                    matches:
                      type: integer
                      example: 750
              biggerPlayersOfTheDay:
                type: array
                items:
                  type: object
                  properties:
                    playerId:
                      type: integer
                      example: 1
                    matches:
                      type: integer
                      example: 3
              winRate:
                type: number
                format: float
                example: 50.0

  /stats/summarize:
    get:
      summary: Extraire un rapport quotidien des activités.
      description: |
        Cet endpoint fournit un rapport agrégé sur les activités de la plateforme par jour.
      produces:
        - application/json
      responses:
        200:
          description: Rapport quotidien récupéré avec succès.
          schema:
            type: object
            properties:
              date:
                type: string
                format: date
                example: "2025-01-24"
              matchesPlayed:
                type: integer
                example: 100
              creaturesUsed:
                type: integer
                example: 75
              winRate:
                type: number
                format: float
                example: 52.5
              totalTransactions:
                type: integer
                example: 25
              totalCreditsExchanged:
                type: number
                example: 1035.0
